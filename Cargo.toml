[package]
name = "epaper"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[[bin]]
name = "epaper"
path = "src/main.rs"

[dependencies]
defmt = "1.0.1"
esp-hal = { version = "~1.2.2", features = ["defmt", "esp32", "unstable"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["defmt", "esp32"] }
critical-section = "1.2.0"
esp-backtrace = { version = "0.20.0", features = ["defmt", "esp32", "panic-handler"] }
esp-println = { version = "0.18.0", features = ["defmt-espflash", "esp32"] }
esp-rtos = { version = "0.4.0", features = ["esp32", "esp-radio", "esp-alloc", "embassy", "defmt"] }
esp-alloc = { version = "0.11.0", features = ["esp32"] }
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32", "unstable", "wifi", "defmt"] }
embassy-net = { version = "0.9.1", default-features = false, features = ["defmt", "dhcpv4", "dns", "medium-ethernet", "proto-ipv4", "tcp", "udp"] }
reqwless = { git = "https://github.com/drogue-iot/reqwless", default-features = false, features = ["defmt", "mbedtls-rs"] }
mbedtls-rs = { version = "0.1.0" }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
